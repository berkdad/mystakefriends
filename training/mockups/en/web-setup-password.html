<meta charset="utf-8">

<title>My Stake Friends</title>
<style>body{width:1280px;margin:0}</style>
<body lang="en">
<div id="root">
<div class="min-h-screen bg-gradient-to-br from-primary-50 via-accent-50 to-tertiary-50 flex items-center justify-center p-4">
<div class="relative bg-white rounded-xl shadow-xl max-w-md w-full p-8">
<div class="absolute top-4 right-4"><div class="inline-flex items-center gap-1 border border-gray-200 rounded-full p-1 bg-white" title="Language"><button class="px-3 py-1 text-sm rounded-full transition-colors bg-primary-500 text-white font-medium" aria-pressed="true">English</button><button class="px-3 py-1 text-sm rounded-full transition-colors text-gray-600 hover:bg-gray-100" aria-pressed="false">Espa&#241;ol</button></div></div>
<div class="text-center mb-8">
<div class="w-16 h-16 bg-gradient-to-br from-primary-500 to-accent-500 rounded-full flex items-center justify-center mx-auto mb-4"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart w-8 h-8 text-white"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></div>
<h1 class="text-2xl font-bold text-gray-800 mb-2">Set Your Password</h1>
<p class="text-gray-600">Welcome to My Stake Friends</p>
<p class="text-sm text-gray-500 italic mt-1">"Hearts Knit in Unity"</p>
</div>
<form class="space-y-4">
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
<div class="relative">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<input type="password" value="" class="w-full pl-10 pr-12 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="Enter your password" required>
<button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye w-5 h-5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
<p class="text-xs text-gray-500 mt-1">At least 8 characters with uppercase, lowercase, and numbers</p>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
<div class="relative">
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
<input type="password" value="" class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent" placeholder="Confirm your password" required>
</div>
</div>
<button type="submit" class="w-full py-3 bg-gradient-to-r from-primary-500 to-accent-500 text-white rounded-lg font-medium hover:from-primary-600 hover:to-accent-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Set Password &amp; Sign In</button>
</form>
<p class="text-center text-sm text-gray-500 mt-6">Already have an account? <button class="text-primary-600 hover:text-primary-700 font-medium">Sign In</button></p>
</div>
</div>
</div>
</body>
