<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Stake Friends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Theme tokens: female (default) = rose/amber/green, male = blue/slate/sky.
      // The active palette is chosen by setting data-theme="male" on <html> (see applyGenderTheme in App.jsx).
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: 'var(--c-primary-50)', 100: 'var(--c-primary-100)', 200: 'var(--c-primary-200)',
                300: 'var(--c-primary-300)', 400: 'var(--c-primary-400)', 500: 'var(--c-primary-500)',
                600: 'var(--c-primary-600)', 700: 'var(--c-primary-700)', 800: 'var(--c-primary-800)',
                900: 'var(--c-primary-900)'
              },
              accent: {
                50: 'var(--c-accent-50)', 100: 'var(--c-accent-100)', 200: 'var(--c-accent-200)',
                300: 'var(--c-accent-300)', 400: 'var(--c-accent-400)', 500: 'var(--c-accent-500)',
                600: 'var(--c-accent-600)', 700: 'var(--c-accent-700)', 800: 'var(--c-accent-800)',
                900: 'var(--c-accent-900)'
              },
              tertiary: {
                50: 'var(--c-tertiary-50)', 100: 'var(--c-tertiary-100)', 200: 'var(--c-tertiary-200)',
                300: 'var(--c-tertiary-300)', 400: 'var(--c-tertiary-400)', 500: 'var(--c-tertiary-500)',
                600: 'var(--c-tertiary-600)', 700: 'var(--c-tertiary-700)', 800: 'var(--c-tertiary-800)',
                900: 'var(--c-tertiary-900)'
              }
            }
          }
        }
      };
    </script>
    <style>
      /* Female palette (default): rose / amber / green */
      :root {
        --c-primary-50:#fff1f2; --c-primary-100:#ffe4e6; --c-primary-200:#fecdd3; --c-primary-300:#fda4af;
        --c-primary-400:#fb7185; --c-primary-500:#f43f5e; --c-primary-600:#e11d48; --c-primary-700:#be123c;
        --c-primary-800:#9f1239; --c-primary-900:#881337;
        --c-accent-50:#fffbeb; --c-accent-100:#fef3c7; --c-accent-200:#fde68a; --c-accent-300:#fcd34d;
        --c-accent-400:#fbbf24; --c-accent-500:#f59e0b; --c-accent-600:#d97706; --c-accent-700:#b45309;
        --c-accent-800:#92400e; --c-accent-900:#78350f;
        --c-tertiary-50:#f0fdf4; --c-tertiary-100:#dcfce7; --c-tertiary-200:#bbf7d0; --c-tertiary-300:#86efac;
        --c-tertiary-400:#4ade80; --c-tertiary-500:#22c55e; --c-tertiary-600:#16a34a; --c-tertiary-700:#15803d;
        --c-tertiary-800:#166534; --c-tertiary-900:#14532d;
      }
      /* Male palette: blue / slate / sky */
      [data-theme="male"] {
        --c-primary-50:#eff6ff; --c-primary-100:#dbeafe; --c-primary-200:#bfdbfe; --c-primary-300:#93c5fd;
        --c-primary-400:#60a5fa; --c-primary-500:#3b82f6; --c-primary-600:#2563eb; --c-primary-700:#1d4ed8;
        --c-primary-800:#1e40af; --c-primary-900:#1e3a8a;
        --c-accent-50:#f8fafc; --c-accent-100:#f1f5f9; --c-accent-200:#e2e8f0; --c-accent-300:#cbd5e1;
        --c-accent-400:#94a3b8; --c-accent-500:#64748b; --c-accent-600:#475569; --c-accent-700:#334155;
        --c-accent-800:#1e293b; --c-accent-900:#0f172a;
        --c-tertiary-50:#f0f9ff; --c-tertiary-100:#e0f2fe; --c-tertiary-200:#bae6fd; --c-tertiary-300:#7dd3fc;
        --c-tertiary-400:#38bdf8; --c-tertiary-500:#0ea5e9; --c-tertiary-600:#0284c7; --c-tertiary-700:#0369a1;
        --c-tertiary-800:#075985; --c-tertiary-900:#0c4a6e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
